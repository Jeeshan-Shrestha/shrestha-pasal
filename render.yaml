# Render Blueprint: New Dashboard > Blueprints > connect this repo.
# Secrets marked sync:false are asked for once in the Render dashboard (never committed).
services:
  - type: web
    name: pasal-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/pasal-backend/Dockerfile
    dockerContext: ./backend/pasal-backend
    healthCheckPath: /api/categories
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Neon: jdbc:postgresql://<host>/<db>?sslmode=require  (host without user/password)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Your Vercel URL, e.g. https://pasal.vercel.app (comma separated for several)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Order emails over HTTPS (Render free blocks SMTP). Verify MAIL_FROM as a sender in Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: OWNER_EMAIL
        sync: false
