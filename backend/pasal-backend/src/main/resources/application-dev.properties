# Local development defaults (docker compose up -d postgres)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pasal}
spring.datasource.username=${DB_USERNAME:pasal}
spring.datasource.password=${DB_PASSWORD:pasal}

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.admin.password=${ADMIN_PASSWORD:admin12345}

spring.jpa.show-sql=false
