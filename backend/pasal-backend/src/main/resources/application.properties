spring.application.name=new-shrestha-bhada-pasal
spring.profiles.default=dev
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT: secret must be at least 32 characters. Never commit a real one.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# Shop rules (amounts in NPR)
app.shop.name=New Shrestha Bhada Pasal
app.shop.delivery-fee=${DELIVERY_FEE:100}
app.shop.free-delivery-threshold=${FREE_DELIVERY_THRESHOLD:3000}

# Admin account created on first start if it does not exist (skipped when password is blank)
app.admin.email=${ADMIN_EMAIL:admin@pasal.local}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=Shop Admin

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Gmail SMTP: new-order email to the owner. Use a Google "app password", not your login password.
# Alerts stay off while any of the three values is blank.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.alerts.mail-username=${MAIL_USERNAME:}
app.alerts.mail-password=${MAIL_PASSWORD:}
app.alerts.owner-email=${OWNER_EMAIL:${MAIL_USERNAME:}}
