services:
  postgres:
    image: postgres:16-alpine
    container_name: pasal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pasal
      POSTGRES_USER: pasal
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pasal}
    volumes:
      - pasal-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pasal -d pasal"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full stack: `cp .env.example .env`, edit the secrets, then `docker compose --profile app up -d --build`
  # For local development just run `docker compose up -d postgres` and `mvn spring-boot:run`.
  backend:
    profiles: ["app"]
    build: .
    container_name: pasal-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/pasal
      DB_USERNAME: pasal
      DB_PASSWORD: ${DB_PASSWORD:-pasal}
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pasal.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"

volumes:
  pasal-pgdata:
